{% set name = "nikola" %}
{% set version = "8.3.3" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/nikola-{{ version }}.tar.gz
  sha256: 636d7d6ffc2ab24f4c2649e8695f8bb5604e309153ea4b60b786facae03ab1c7

build:
  number: 0
  noarch: python
  entry_points:
    - nikola = nikola.__main__:main
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=60.0.5
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - doit >=0.33.1
    - pygments >=2.4.2
    - pillow >=9.1.0
    - python-dateutil >=2.8.2
    - docutils >=0.19
    - mako >=1.0.9
    - markdown >=3.0
    - unidecode >=0.4.16
    - lxml >=4.5.2
    - pyrss2gen >=1.1
    - blinker >=1.3
    - setuptools >=60.0.5
    - natsort >=5.1.0
    - requests >=2.31.0
    - piexif >=1.0.3
    - babel >=2.12.0
  # https://github.com/getnikola/nikola/blob/master/requirements-extras.txt
  run_constrained:
    - jinja2 >=2.7.2
    - husl >=4.0.2
    - pyphen >=0.9.1
    - micawber >=0.3.0
    - pygal >=2.0.0
    - typogrify >=2.0.4
    - phpserialize >=1.3
    - notebook >=4.0.0
    - ipykernel >=4.0.0
    # see issue #2
    - ghp-import >=1.0.0
    - aiohttp >=3.0.0
    - watchdog >=0.8.3
    - ruamel.yaml >=0.15
    - toml >=0.9.2

test:
  imports:
    - nikola
    - nikola.packages
  commands:
    # no pip check: conda-forge's piexif wheel metadata is reported as unsupported
    - nikola --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://getnikola.com/
  summary: A modular, fast, simple, static website and blog generator
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - ickc
